[project]
name = "wav-to-ogg"
version = "0.1.0"
description = "A command-line tool to convert WAV audio files to OGG format"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.8.1"
dependencies = [
    "pydub>=0.25.1,<0.26",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.scripts]
wav-to-ogg = "wav_to_ogg.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0,<8",
    "black>=23.0.0,<24",
    "flake8>=6.0.0,<7",
    "mypy>=1.0.0,<2",
    "isort>=5.12.0,<6",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wav_to_ogg"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pydub", "pydub.*"]
ignore_missing_imports = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
